<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>untitled - Paint</title>
  <meta name="description" content="Fridge magnet art — collaborative MS Paint for The Office.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/lib/interior-ui.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #7f9db9;
      font-family: "Tahoma", "Segoe UI", "MS Sans Serif", sans-serif;
      font-size: 11px;
      color: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    .paint-app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 3px;
      gap: 0;
    }

    /* Title bar */
    .title-bar {
      display: flex;
      align-items: center;
      height: 26px;
      padding: 0 4px;
      background: linear-gradient(180deg, #0a246a 0%, #0a246a 8%, #3a6ea5 40%, #4a90d9 88%, #6eb4ff 100%);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.01em;
      flex-shrink: 0;
    }

    .title-bar .icon {
      width: 16px;
      height: 16px;
      margin-right: 4px;
      background:
        linear-gradient(#fff 0 0) 2px 2px/12px 12px no-repeat,
        linear-gradient(135deg, #ff0000 0%, #ffff00 25%, #00ff00 50%, #00ffff 75%, #0000ff 100%);
      border: 1px solid #fff;
    }

    /* Menu bar */
    .menu-bar {
      display: flex;
      gap: 0;
      height: 20px;
      align-items: center;
      padding: 0 2px;
      background: #ece9d8;
      border: 1px solid;
      border-color: #fff #808080 #808080 #fff;
      flex-shrink: 0;
    }

    .menu-item {
      padding: 2px 8px;
      cursor: default;
    }

    .menu-item:hover {
      background: #316ac5;
      color: #fff;
    }

    /* Main workspace */
    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 2px;
      margin-top: 2px;
    }

    /* Toolbox */
    .toolbox {
      width: 54px;
      flex-shrink: 0;
      background: #ece9d8;
      border: 2px solid;
      border-color: #fff #808080 #808080 #fff;
      padding: 3px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tool-btn {
      width: 44px;
      height: 44px;
      border: 1px solid transparent;
      background: #ece9d8;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 2px;
    }

    .tool-btn:hover {
      border-color: #fff #808080 #808080 #fff;
    }

    .tool-btn.active {
      border-color: #808080 #fff #fff #808080;
      background: #d4d0c8;
    }

    .tool-btn svg {
      width: 32px;
      height: 32px;
      image-rendering: pixelated;
    }

    /* Canvas area */
    .canvas-wrap {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #808080;
      border: 2px solid;
      border-color: #404040 #fff #fff #404040;
      overflow: auto;
    }

    .canvas-scroll {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 8px;
      background: #808080;
    }

    .canvas-frame {
      background: #fff;
      box-shadow: 1px 1px 0 #000;
      line-height: 0;
    }

    #paintCanvas {
      display: block;
      cursor: crosshair;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Color palette strip */
    .palette-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      background: #ece9d8;
      border-top: 1px solid #808080;
      flex-shrink: 0;
    }

    .color-primary, .color-secondary {
      width: 20px;
      height: 20px;
      border: 1px solid #000;
      flex-shrink: 0;
    }

    .color-secondary {
      margin-left: -10px;
      margin-top: 10px;
      position: relative;
      z-index: 0;
    }

    .color-primary {
      position: relative;
      z-index: 1;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(14, 16px);
      gap: 1px;
      flex: 1;
    }

    .swatch {
      width: 16px;
      height: 16px;
      border: 1px solid #808080;
      cursor: pointer;
    }

    .swatch:hover {
      outline: 1px solid #000;
    }

    /* Status */
    .status-bar {
      height: 18px;
      display: flex;
      align-items: center;
      padding: 0 6px;
      background: #ece9d8;
      border: 1px solid;
      border-color: #808080 #fff #fff #808080;
      font-size: 11px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .status-bar .sep {
      margin: 0 8px;
      color: #808080;
    }

    .save-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c0c0c0;
      margin-right: 6px;
      flex-shrink: 0;
    }

    .save-dot.pending { background: #e8a317; }
    .save-dot.saved { background: #3cb043; }
    .save-dot.error { background: #d93025; }

    /* Embed: tuck back button beside chrome */
    html.interior-embed .wii-back {
      z-index: 50;
    }

    @media (max-width: 600px) {
      .toolbox { width: 48px; }
      .tool-btn { width: 38px; height: 38px; }
      .tool-btn svg { width: 26px; height: 26px; }
      .palette-grid { grid-template-columns: repeat(7, 16px); }
    }
  </style>
<script defer src="/lib/analytics.js"></script>
</head>
<body>
  <a class="wii-back" href="/" id="btnBack" aria-label="Back to the Office" data-tip="Back to the Office">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 6l-6 6 6 6"/>
    </svg>
  </a>

  <div class="paint-app">
    <div class="title-bar">
      <span class="icon" aria-hidden="true"></span>
      <span id="docTitle">untitled - Paint</span>
    </div>

    <nav class="menu-bar" aria-label="Paint menus">
      <span class="menu-item" id="menuNew">File</span>
      <span class="menu-item" id="menuClear">Edit</span>
      <span class="menu-item">View</span>
      <span class="menu-item">Image</span>
      <span class="menu-item">Colors</span>
      <span class="menu-item">Help</span>
    </nav>

    <div class="workspace">
      <aside class="toolbox" aria-label="Tools">
        <button type="button" class="tool-btn active" data-tool="pencil" title="Pencil" aria-label="Pencil">
          <svg viewBox="0 0 32 32"><path d="M4 28 L24 8 L26 10 L6 30 Z" fill="#000"/><path d="M24 8 L28 4 L30 6 L26 10 Z" fill="#ffcc00"/></svg>
        </button>
        <button type="button" class="tool-btn" data-tool="brush" title="Brush" aria-label="Brush">
          <svg viewBox="0 0 32 32"><ellipse cx="10" cy="22" rx="6" ry="4" fill="#333"/><rect x="12" y="6" width="4" height="16" fill="#8b4513" transform="rotate(-30 14 14)"/><rect x="18" y="4" width="6" height="3" fill="#666" transform="rotate(-30 21 5)"/></svg>
        </button>
        <button type="button" class="tool-btn" data-tool="eraser" title="Eraser" aria-label="Eraser">
          <svg viewBox="0 0 32 32"><rect x="6" y="14" width="20" height="10" fill="#ffb6c1" stroke="#000"/><rect x="8" y="10" width="16" height="6" fill="#fff" stroke="#000"/></svg>
        </button>
        <button type="button" class="tool-btn" data-tool="fill" title="Fill With Color" aria-label="Fill">
          <svg viewBox="0 0 32 32"><path d="M8 24 L16 8 L24 16 L16 28 Z" fill="#888"/><rect x="6" y="26" width="20" height="4" fill="#00f"/></svg>
        </button>
        <button type="button" class="tool-btn" data-tool="picker" title="Pick Color" aria-label="Color picker">
          <svg viewBox="0 0 32 32"><path d="M4 28 L20 12 L24 16 L8 32 Z" fill="#333"/><circle cx="22" cy="8" r="5" fill="none" stroke="#000" stroke-width="2"/></svg>
        </button>
      </aside>

      <div class="canvas-wrap">
        <div class="canvas-scroll">
          <div class="canvas-frame">
            <canvas id="paintCanvas" width="584" height="400"></canvas>
          </div>
        </div>
        <div class="palette-bar">
          <div class="color-secondary" id="colorSecondary" style="background:#fff"></div>
          <div class="color-primary" id="colorPrimary" style="background:#000"></div>
          <div class="palette-grid" id="palette"></div>
        </div>
      </div>
    </div>

    <footer class="status-bar">
      <span class="save-dot" id="saveDot" title="Save status"></span>
      <span id="statusCoords">584 x 400px</span>
      <span class="sep">|</span>
      <span id="statusTool">For Help, click Help Topics on the Help Menu.</span>
    </footer>
  </div>

  <script src="/lib/interior-ui.js"></script>
  <script>
(function () {
  'use strict';

  const W = 584, H = 400;
  const API = '/api/fridge-art';

  const PALETTE = [
    '#000000', '#7f7f7f', '#880015', '#ed1c24', '#ff7f27', '#fff200', '#22b14c', '#00a2e8',
    '#3f48cc', '#a349a4', '#ffffff', '#c3c3c3', '#b97a57', '#ffaec9', '#ffc90e', '#efe4b0',
    '#b5e61d', '#99d9ea', '#7092be', '#c8bfe7', '#000000', '#808080', '#800000', '#ff0000',
    '#ff8000', '#ffff00', '#008000', '#008080', '#0000ff', '#800080', '#808000', '#008000'
  ].slice(0, 28);

  const canvas = document.getElementById('paintCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const paletteEl = document.getElementById('palette');
  const colorPrimary = document.getElementById('colorPrimary');
  const colorSecondary = document.getElementById('colorSecondary');
  const statusCoords = document.getElementById('statusCoords');
  const statusTool = document.getElementById('statusTool');
  const saveDot = document.getElementById('saveDot');
  const docTitle = document.getElementById('docTitle');
  const btnBack = document.getElementById('btnBack');

  let tool = 'pencil';
  let primary = '#000000';
  let secondary = '#ffffff';
  let drawing = false;
  let saveTimer = null;
  let saving = false;
  let dirty = false;
  let lastX = 0, lastY = 0;

  function setSaveState(state) {
    saveDot.className = 'save-dot' + (state ? ' ' + state : '');
  }

  function setPrimary(c) {
    primary = c;
    colorPrimary.style.background = c;
  }

  function setSecondary(c) {
    secondary = c;
    colorSecondary.style.background = c;
  }

  function pickColor(e) {
    if (e.button === 2 || e.shiftKey) setSecondary(e.target.dataset.color);
    else setPrimary(e.target.dataset.color);
  }

  PALETTE.forEach((c) => {
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'swatch';
    sw.style.background = c;
    sw.dataset.color = c;
    sw.title = c;
    sw.addEventListener('mousedown', (e) => { e.preventDefault(); pickColor(e); });
    sw.addEventListener('contextmenu', (e) => e.preventDefault());
    paletteEl.appendChild(sw);
  });

  document.querySelectorAll('.tool-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tool-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      tool = btn.dataset.tool;
      statusTool.textContent = btn.title + ' selected';
    });
  });

  function canvasPos(e) {
    const r = canvas.getBoundingClientRect();
    const sx = canvas.width / r.width;
    const sy = canvas.height / r.height;
    return {
      x: Math.max(0, Math.min(W - 1, Math.floor((e.clientX - r.left) * sx))),
      y: Math.max(0, Math.min(H - 1, Math.floor((e.clientY - r.top) * sy)))
    };
  }

  function markDirty() {
    dirty = true;
    setSaveState('pending');
    docTitle.textContent = '* untitled - Paint';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCanvas, 600);
  }

  /* Flush pending save immediately when the tab or iframe is hidden —
     covers closing the overlay without clicking the in-app back button. */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && dirty) {
      clearTimeout(saveTimer);
      saveCanvas();
    }
  });

  /* Parent asks us to save before tearing down the frame. */
  window.addEventListener('message', (ev) => {
    if (ev.origin !== location.origin) return;
    if (ev.data?.type === 'coworking:fridge-save-sync' && dirty) {
      clearTimeout(saveTimer);
      saveCanvas();
    }
  });

  function strokeLine(x0, y0, x1, y1, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x0 + 0.5, y0 + 0.5);
    ctx.lineTo(x1 + 0.5, y1 + 0.5);
    ctx.stroke();
  }

  function floodFill(startX, startY, fillColor) {
    const img = ctx.getImageData(0, 0, W, H);
    const data = img.data;
    const startIdx = (startY * W + startX) * 4;
    const sr = data[startIdx], sg = data[startIdx + 1], sb = data[startIdx + 2], sa = data[startIdx + 3];

    const fr = parseInt(fillColor.slice(1, 3), 16);
    const fg = parseInt(fillColor.slice(3, 5), 16);
    const fb = parseInt(fillColor.slice(5, 7), 16);

    if (sr === fr && sg === fg && sb === fb && sa === 255) return;

    const stack = [[startX, startY]];
    const visited = new Uint8Array(W * H);

    function match(idx) {
      return data[idx] === sr && data[idx + 1] === sg && data[idx + 2] === sb && data[idx + 3] === sa;
    }

    while (stack.length) {
      const [x, y] = stack.pop();
      const vi = y * W + x;
      if (x < 0 || x >= W || y < 0 || y >= H || visited[vi]) continue;
      const idx = vi * 4;
      if (!match(idx)) continue;
      visited[vi] = 1;
      data[idx] = fr;
      data[idx + 1] = fg;
      data[idx + 2] = fb;
      data[idx + 3] = 255;
      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
    ctx.putImageData(img, 0, 0);
  }

  function applyTool(x, y, isStart) {
    if (tool === 'fill') {
      floodFill(x, y, primary);
      markDirty();
      return;
    }
    if (tool === 'picker') {
      const p = ctx.getImageData(x, y, 1, 1).data;
      const hex = '#' + [p[0], p[1], p[2]].map((v) => v.toString(16).padStart(2, '0')).join('');
      setPrimary(hex);
      return;
    }
    const color = tool === 'eraser' ? secondary : primary;
    const width = tool === 'brush' ? 5 : tool === 'eraser' ? 10 : 1;
    if (isStart) strokeLine(x, y, x, y, color, width);
    else strokeLine(lastX, lastY, x, y, color, width);
    lastX = x;
    lastY = y;
    markDirty();
  }

  function pointerDown(e) {
    if (e.button > 0) return;
    e.preventDefault();
    drawing = true;
    const p = canvasPos(e);
    applyTool(p.x, p.y, true);
  }

  function pointerMove(e) {
    const p = canvasPos(e);
    statusCoords.textContent = p.x + ', ' + p.y + 'px';
    if (!drawing) return;
    e.preventDefault();
    applyTool(p.x, p.y, false);
  }

  function pointerUp() {
    drawing = false;
  }

  canvas.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); pointerDown(e.changedTouches[0]); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); pointerMove(e.changedTouches[0]); }, { passive: false });
  canvas.addEventListener('touchend', pointerUp);

  function blankCanvas() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
  }

  async function loadCanvas() {
    try {
      const res = await fetch(API, { cache: 'no-store' });
      if (res.ok) {
        const blob = await res.blob();
        const bmp = await createImageBitmap(blob);
        ctx.drawImage(bmp, 0, 0, W, H);
        dirty = false;
        setSaveState('saved');
        docTitle.textContent = 'fridge-art - Paint';
        return;
      }
    } catch { /* fall through to blank doc */ }

    blankCanvas();
    dirty = false;
    setSaveState('');
    docTitle.textContent = 'untitled - Paint';
  }

  async function saveCanvas() {
    if (saving) return;
    saving = true;
    setSaveState('pending');
    try {
      const image = canvas.toDataURL('image/png');
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'save failed ' + res.status);
      }
      const data = await res.json().catch(() => ({}));
      dirty = false;
      setSaveState('saved');
      docTitle.textContent = 'fridge-art - Paint';
      notifyParent(data.updated);
    } catch (e) {
      console.error('[fridge-paint] save error:', e);
      setSaveState('error');
    } finally {
      saving = false;
    }
  }

  function notifyParent(updated) {
    try {
      if (window.parent && window.parent !== window) {
        parent.postMessage({ type: 'coworking:fridge-art-updated', updated }, location.origin);
      }
    } catch { /* ignore */ }
  }

  function clearCanvas() {
    if (!confirm('Clear the whole canvas?')) return;
    blankCanvas();
    markDirty();
  }

  document.getElementById('menuClear').addEventListener('click', clearCanvas);
  document.getElementById('menuNew').addEventListener('click', clearCanvas);

  btnBack.addEventListener('click', async (e) => {
    /* Always intercept when embedded — the parent manages overlay close. */
    const inFrame = window.self !== window.top;
    if (!inFrame && !dirty && !saveTimer) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    clearTimeout(saveTimer);
    if (dirty || saving) await saveCanvas();
    try {
      if (inFrame) {
        parent.postMessage({ type: 'coworking:close-interior' }, location.origin);
      } else {
        location.assign('/');
      }
    } catch {
      location.assign('/');
    }
  }, true);

  loadCanvas();
})();
  </script>
</body>
</html>
