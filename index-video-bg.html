<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CO—WORKING</title>
  <meta name="description" content="CO—WORKING — a fictional corporation that accidentally becomes a real one. Enterprise solutions for creative people.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.coworking.fyi/">
  <meta property="og:title" content="CO—WORKING">
  <meta property="og:description" content="A fictional corporation that accidentally becomes a real one. Enterprise solutions for creative people.">
  <meta property="og:image" content="https://www.coworking.fyi/images/og-plaza.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="The CO—WORKING office">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CO—WORKING">
  <meta name="twitter:description" content="A fictional corporation that accidentally becomes a real one. Enterprise solutions for creative people.">
  <meta name="twitter:image" content="https://www.coworking.fyi/images/og-plaza.jpg">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="images/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lib/interior-ui.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .video-bg video {
      height: auto;
      max-height: 100%;
      width: auto;
      animation: grow-video 3.5s linear forwards;
    }

    @keyframes grow-video {
      0% {
        transform: scale(0.05);
      }
      100% {
        transform: scale(1);
      }
    }

    /* ——— Logo Overlay ——— */
    .logo-overlay {
      position: fixed;
      top: 50%;
      left: 2rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 20;
      text-align: left;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      animation: brew-drift 2.5s ease-in forwards;
    }

    @keyframes brew-drift {
      0%   { transform: translateY(-50%); opacity: 1; }
      70%  { transform: translateY(calc(-50% + 22px)); opacity: 1; }
      100% { transform: translateY(calc(-50% + 32px)); opacity: 0; }
    }
    .logo-overlay { animation-duration: 3.5s; }

    .logo-we-are {
      font-family: "Arial Black", Impact, "Franklin Gothic Heavy", sans-serif;
      font-size: clamp(1.2rem, 3.5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 0.01em;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .logo-brewing {
      font-family: "Arial Black", Impact, "Franklin Gothic Heavy", sans-serif;
      font-size: clamp(2.5rem, 9vw, 6rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #fff;
      line-height: 0.95;
    }

    .logo-main {
      display: none;
    }

    .site-nav {
      position: fixed;
      top: 2rem;
      right: 2rem;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .site-nav a {
      font-family: "IBM Plex Mono", "SF Mono", "Cascadia Mono", monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
    }

    .site-nav a:hover {
      text-decoration: underline;
    }

    .nav-cta {
      border: 1px solid #fff;
      padding: 0.4rem 0.7rem;
      background: #fff;
      color: #000 !important;
    }

    .nav-cta:hover {
      background: transparent;
      color: #fff !important;
      text-decoration: none !important;
    }

    .page-nav {
      position: fixed;
      top: 2rem;
      right: calc(2rem + 10rem);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      height: 1.5rem;
      line-height: 1.5rem;
    }

    .page-nav-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
      padding: 0.25rem;
      opacity: 0.6;
      transition: opacity 0.2s ease;
      font-family: system-ui, sans-serif;
      line-height: 1;
    }

    .page-nav-btn:hover {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .page-nav {
        position: fixed;
        top: 1rem;
        right: calc(1rem + 4px);
        left: auto;
        z-index: 9999;
        gap: 1rem;
      }

      .page-nav-btn {
        font-size: 2.2rem;
        padding: 0.75rem;
        -webkit-tap-highlight-color: rgba(255,255,255,0.2);
        touch-action: manipulation;
      }

      .logo-overlay {
        left: 1.5rem;
      }

      .logo-we-are {
        font-size: 1.25rem;
      }

      .logo-main {
        max-width: 70vw;
      }

      .site-nav {
        position: absolute;
        top: 50%;
        left: 1.5rem;
        right: auto;
        transform: translateY(calc(-50% + 4.5rem));
        gap: 0.75rem;
        justify-content: flex-start;
      }

      .site-nav a {
        font-size: 0.62rem;
      }

      .nav-cta {
        padding: 0.35rem 0.55rem;
      }
    }

    /* ——— Scroll Spacer ——— */
    .scroll-spacer {
      height: 100vh;
      pointer-events: none;
      position: relative;
    }

    .scroll-content {
      display: none;
    }

    /* ——— Footer ——— */
    .site-footer {
      position: relative;
      z-index: 30;
      background: transparent;
      padding: 1.5rem clamp(1.25rem, 4vw, 2.5rem) 2rem;
      color: #fff;
    }

    .footer-inner {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 2rem;
      align-items: start;
      text-align: left;
    }

    .footer-brand {
      text-align: left;
      justify-self: start;
    }

    .footer-position {
      margin: 0;
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      color: #fff;
    }

    .footer-label {
      margin: 0 0 0.5rem;
      font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }

    .footer-team ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .footer-team li {
      margin-bottom: 0.35rem;
      font-size: 0.9rem;
      color: #fff;
    }

    .footer-meta {
      text-align: right;
      font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }

    .footer-meta p {
      margin: 0 0 0.5rem;
    }

    .footer-meta a {
      font-family: inherit;
      font-size: inherit;
      color: #fff;
      text-decoration: none;
    }

    .footer-meta a:hover {
      text-decoration: underline;
      color: #fff;
    }

    @media (max-width: 900px) {
      .footer-inner {
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }

      .footer-brand {
        grid-column: 1 / -1;
      }

      .footer-meta {
        text-align: left;
      }
    }

    @media (max-width: 600px) {
      .scroll-spacer {
        height: auto;
        min-height: 100vh;
        display: flex;
        align-items: center;
        pointer-events: auto;
      }

      .scroll-content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 1.5rem;
        padding-top: calc(1.5rem + 13px);
        gap: 0.5rem;
      }

      .scroll-content .logo-we-are {
        font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
        margin: 0 0 0.85rem 0;
      }

      .scroll-content .logo-main {
        max-width: 70vw;
        height: auto;
      }

      .scroll-content .nav-cta {
        margin-top: 1rem;
        font-family: "IBM Plex Mono", "SF Mono", "Cascadia Mono", monospace;
        font-size: 0.62rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        color: #000;
        border: 1px solid #fff;
        padding: 0.35rem 0.55rem;
        background: #fff;
      }

      .site-nav {
        display: none;
      }

      .footer-inner {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <a class="wii-back" href="/" aria-label="Back to the Office" data-tip="Back to the Office">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 6l-6 6 6 6"/>
    </svg>
  </a>

  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="images/bg-video.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Logo Overlay -->
  <a href="/" class="logo-overlay">
    <p class="logo-we-are">we are</p>
    <p class="logo-brewing">brewing...</p>
    <img class="logo-main" src="images/logo-lockup.png?v=2" alt="CO—WORKING">
  </a>

  <audio id="brewAudio" src="images/brewing-music.mp3" preload="auto"></audio>
  <script>
    (function() {
      const a = document.getElementById('brewAudio');
      a.play().catch(() => {});

      function closeOverlay() {
        try {
          window.parent.postMessage({ type: 'coworking:close-interior' }, location.origin);
        } catch (e) {}
        if (window.parent === window) history.back();
      }

      function playBrewDone() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          // Steam hiss burst
          const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.55), ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
          const noise = ctx.createBufferSource();
          noise.buffer = buf;
          const filt = ctx.createBiquadFilter();
          filt.type = 'bandpass'; filt.frequency.value = 1400; filt.Q.value = 0.6;
          const gNoise = ctx.createGain();
          gNoise.gain.setValueAtTime(0.35, ctx.currentTime);
          gNoise.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
          noise.connect(filt); filt.connect(gNoise); gNoise.connect(ctx.destination);
          noise.start();
          // Short descending tone
          const osc = ctx.createOscillator();
          osc.type = 'sine'; osc.frequency.setValueAtTime(420, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.45);
          const gOsc = ctx.createGain();
          gOsc.gain.setValueAtTime(0.18, ctx.currentTime);
          gOsc.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.connect(gOsc); gOsc.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.45);
        } catch (e) {}
      }

      // Close when the zoom animation finishes (video hits full height)
      const vid = document.querySelector('.video-bg video');
      if (vid) {
        vid.addEventListener('animationend', () => {
          a.pause();
          playBrewDone();
          setTimeout(closeOverlay, 700);
        }, { once: true });
      }
      // Fallback
      setTimeout(closeOverlay, 8000);
    })();
  </script>
  <script src="/lib/interior-ui.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
