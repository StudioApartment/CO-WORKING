<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CO—WORKING</title>
  <meta name="description" content="CO—WORKING — a fictional corporation that accidentally becomes a real one. Enterprise solutions for creative people.">
  <meta property="og:title" content="CO—WORKING">
  <meta property="og:description" content="A fictional corporation that accidentally becomes a real one. Enterprise solutions for creative people.">
  <meta property="og:image" content="images/hero-scan.png">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="images/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .video-bg video {
      height: auto;
      max-height: 100%;
      width: auto;
      animation: grow-video 60s linear forwards;
    }

    @keyframes grow-video {
      0% {
        transform: scale(0.05);
      }
      100% {
        transform: scale(1);
      }
    }

    /* ——— Logo Overlay ——— */
    .logo-overlay {
      position: absolute;
      top: 2rem;
      left: 2rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 20;
      text-align: left;
    }

    .logo-we-are {
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(1.5rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .logo-main {
      width: auto;
      height: auto;
      max-width: min(90vw, 36rem);
      filter: brightness(0) invert(1);
    }

    .site-nav {
      position: absolute;
      top: 2rem;
      right: 2rem;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .site-nav a {
      font-family: "IBM Plex Mono", "SF Mono", "Cascadia Mono", monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
    }

    .site-nav a:hover {
      text-decoration: underline;
    }

    .nav-cta {
      border: 1px solid #fff;
      padding: 0.4rem 0.7rem;
      background: #fff;
      color: #000 !important;
    }

    .nav-cta:hover {
      background: transparent;
      color: #fff !important;
      text-decoration: none !important;
    }

    @media (max-width: 600px) {
      .logo-overlay {
        top: 1rem;
        left: 1rem;
      }

      .logo-we-are {
        font-size: 1.25rem;
      }

      .logo-main {
        max-width: 70vw;
      }

      .site-nav {
        top: 1rem;
        right: 1rem;
        gap: 0.75rem;
      }

      .site-nav a {
        font-size: 0.62rem;
      }

      .nav-cta {
        padding: 0.35rem 0.55rem;
      }
    }
  </style>
</head>
<body>
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="images/bg-video.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Logo Overlay -->
  <div class="logo-overlay">
    <p class="logo-we-are">we are</p>
    <img class="logo-main" src="images/logo-lockup.png?v=2" alt="CO—WORKING">
  </div>

  <!-- Site Nav -->
  <nav class="site-nav">
    <a href="/events.html" style="display: none;">Panel Discussions</a>
    <a class="nav-cta" href="https://co-badge.netlify.app" target="_blank" rel="noopener noreferrer">Get your badge →</a>
  </nav>
</body>
</html>
