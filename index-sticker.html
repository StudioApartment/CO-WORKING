<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CO—WORKING</title>
  <meta name="description" content="CO—WORKING — a fictional corporation that accidentally becomes a real one. Enterprise solutions for creative people.">
  <meta property="og:title" content="CO—WORKING">
  <meta property="og:description" content="A fictional corporation that accidentally becomes a real one. Enterprise solutions for creative people.">
  <meta property="og:image" content="images/hero-scan.png">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="images/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .sticker-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .sticker {
      position: absolute;
      width: clamp(180px, 30vw, 350px);
      height: auto;
      will-change: transform;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5));
    }

    .sticker img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ——— Logo Overlay ——— */
    .logo-overlay {
      position: absolute;
      top: calc(2rem + 6px);
      left: 2rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 20;
      text-align: left;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .logo-we-are {
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(1.5rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .logo-main {
      width: auto;
      height: auto;
      max-width: min(90vw, 36rem);
      filter: brightness(0) invert(1);
    }

    .site-nav {
      position: absolute;
      top: 2rem;
      right: 2rem;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .site-nav a {
      font-family: "IBM Plex Mono", "SF Mono", "Cascadia Mono", monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
    }

    .site-nav a:hover {
      text-decoration: underline;
    }

    .nav-cta {
      border: 1px solid #fff;
      padding: 0.4rem 0.7rem;
      background: #fff;
      color: #000 !important;
    }

    .nav-cta:hover {
      background: transparent;
      color: #fff !important;
      text-decoration: none !important;
    }

    @media (max-width: 600px) {
      .logo-overlay {
        top: 50%;
        left: 1.5rem;
        transform: translateY(calc(-50% + 13px));
      }

      .logo-we-are {
        font-size: 1.25rem;
      }

      .logo-main {
        max-width: 70vw;
      }

      .site-nav {
        position: absolute;
        top: 50%;
        left: 1.5rem;
        right: auto;
        transform: translateY(calc(-50% + 4.5rem + 13px));
        gap: 0.75rem;
        justify-content: flex-start;
      }

      .site-nav a {
        font-size: 0.62rem;
      }

      .nav-cta {
        padding: 0.35rem 0.55rem;
      }

      .sticker {
        width: clamp(120px, 40vw, 200px);
      }
    }

    /* ——— Scroll Spacer ——— */
    .scroll-spacer {
      height: 100vh;
      pointer-events: none;
    }

    /* ——— Footer ——— */
    .site-footer {
      position: relative;
      z-index: 30;
      background: transparent;
      padding: 1.5rem clamp(1.25rem, 4vw, 2.5rem) 2rem;
      color: #fff;
    }

    .footer-inner {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 2rem;
      align-items: start;
      text-align: left;
    }

    .footer-brand {
      text-align: left;
      justify-self: start;
    }

    .footer-position {
      margin: 0;
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      color: #fff;
      opacity: 0.7;
    }

    .footer-label {
      margin: 0 0 0.5rem;
      font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }

    .footer-team ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .footer-team li {
      margin-bottom: 0.35rem;
      font-size: 0.9rem;
      color: #fff;
    }

    .footer-meta {
      text-align: right;
      font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }

    .footer-meta p {
      margin: 0 0 0.5rem;
    }

    .footer-meta a {
      font-family: inherit;
      font-size: inherit;
      color: #fff;
      text-decoration: none;
    }

    .footer-meta a:hover {
      text-decoration: underline;
      color: #fff;
    }

    @media (max-width: 900px) {
      .footer-inner {
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }

      .footer-brand {
        grid-column: 1 / -1;
      }

      .footer-meta {
        text-align: left;
      }
    }

    @media (max-width: 600px) {
      .scroll-spacer {
        height: 110vh;
      }

      .footer-inner {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="sticker-container">
    <div class="sticker" id="sticker">
      <img src="images/co-sticker.png" alt="CO sticker">
    </div>
  </div>

  <!-- Logo Overlay -->
  <a href="#" class="logo-overlay" onclick="goToRandomIndex(event)">
    <p class="logo-we-are">we are</p>
    <img class="logo-main" src="images/logo-lockup.png?v=2" alt="CO—WORKING">
  </a>
  <script>
    (function() {
      const current = 'index-sticker.html';
      const nav = performance.getEntriesByType('navigation')[0];
      if (nav && nav.type === 'reload') {
        window.location.replace('index.html?exclude=' + current);
        return;
      }
      window.goToRandomIndex = function(e) {
        e.preventDefault();
        window.location.href = 'index.html?exclude=' + current;
      };
    })();
  </script>

  <!-- Site Nav -->
  <nav class="site-nav">
    <a href="/events.html" style="display: none;">Panel Discussions</a>
    <a class="nav-cta" href="https://co-badge.netlify.app" target="_blank" rel="noopener noreferrer">Get your badge →</a>
  </nav>

  <!-- Spacer to enable footer scroll -->
  <div class="scroll-spacer"></div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <p class="footer-position">Productivity Through Atmosphere.</p>
      </div>
      <div class="footer-team">
        <p class="footer-label">Department Heads</p>
        <ul>
          <li><strong>Sky Bruno</strong> — Internal Systems</li>
          <li><strong>Ty Allen</strong> — Spatial Operations</li>
          <li><strong>Gage Salzano</strong> — Culture</li>
        </ul>
      </div>
      <div class="footer-meta">
        <p>CO—WORKING © 2026</p>
        <p>NEW YORK, NY</p>
        <a href="https://co-badge.netlify.app" target="_blank" rel="noopener noreferrer">EMPLOYEE PORTAL →</a>
      </div>
    </div>
  </footer>

  <script>
    (function() {
      const sticker = document.getElementById('sticker');
      const container = document.querySelector('.sticker-container');
      
      const stickerRect = sticker.getBoundingClientRect();
      const stickerWidth = stickerRect.width;
      const stickerHeight = stickerRect.height;
      
      let x = Math.random() * (window.innerWidth - stickerWidth);
      let y = Math.random() * (window.innerHeight - stickerHeight);
      
      // Speed as percentage of screen per second
      const speedPercent = 18;
      
      function getBaseSpeed() {
        return (Math.min(window.innerWidth, window.innerHeight) * speedPercent) / 100 / 60;
      }
      
      let baseSpeed = getBaseSpeed();
      let vx = baseSpeed * (Math.random() > 0.5 ? 1 : -1);
      let vy = baseSpeed * (Math.random() > 0.5 ? 1 : -1);
      
      let cornerThreshold = 60;
      
      function isNearCorner(x, y, w, h, screenW, screenH) {
        const nearLeft = x < cornerThreshold;
        const nearRight = x + w > screenW - cornerThreshold;
        const nearTop = y < cornerThreshold;
        const nearBottom = y + h > screenH - cornerThreshold;
        return (nearLeft || nearRight) && (nearTop || nearBottom);
      }
      
      function nudgeAwayFromCorner() {
        const w = stickerWidth;
        const h = stickerHeight;
        const screenW = window.innerWidth;
        const screenH = window.innerHeight;
        const nudge = baseSpeed * 0.2;
        
        const nearLeft = x < cornerThreshold;
        const nearRight = x + w > screenW - cornerThreshold;
        const nearTop = y < cornerThreshold;
        const nearBottom = y + h > screenH - cornerThreshold;
        
        if (nearLeft && nearTop) {
          if (Math.abs(vx) < Math.abs(vy)) vx = Math.abs(vx) + nudge;
          else vy = Math.abs(vy) + nudge;
        } else if (nearRight && nearTop) {
          if (Math.abs(vx) < Math.abs(vy)) vx = -Math.abs(vx) - nudge;
          else vy = Math.abs(vy) + nudge;
        } else if (nearLeft && nearBottom) {
          if (Math.abs(vx) < Math.abs(vy)) vx = Math.abs(vx) + nudge;
          else vy = -Math.abs(vy) - nudge;
        } else if (nearRight && nearBottom) {
          if (Math.abs(vx) < Math.abs(vy)) vx = -Math.abs(vx) - nudge;
          else vy = -Math.abs(vy) - nudge;
        }
        
        const maxSpeed = baseSpeed * 1.8;
        vx = Math.max(-maxSpeed, Math.min(maxSpeed, vx));
        vy = Math.max(-maxSpeed, Math.min(maxSpeed, vy));
      }
      
      // Use setInterval as fallback for low power mode (less throttled than rAF)
      let lastTime = performance.now();
      const targetFPS = 60;
      const interval = 1000 / targetFPS;
      
      function update() {
        const now = performance.now();
        const deltaTime = Math.min((now - lastTime) / interval, 3); // Cap delta to prevent jumps
        lastTime = now;
        
        const w = stickerWidth;
        const h = stickerHeight;
        const screenW = window.innerWidth;
        const screenH = window.innerHeight;
        
        x += vx * deltaTime;
        y += vy * deltaTime;
        
        if (x <= 0) { x = 0; vx = Math.abs(vx); }
        else if (x + w >= screenW) { x = screenW - w; vx = -Math.abs(vx); }
        
        if (y <= 0) { y = 0; vy = Math.abs(vy); }
        else if (y + h >= screenH) { y = screenH - h; vy = -Math.abs(vy); }
        
        if (isNearCorner(x, y, w, h, screenW, screenH)) {
          nudgeAwayFromCorner();
        } else {
          const speedMag = Math.sqrt(vx * vx + vy * vy);
          if (speedMag > baseSpeed) {
            const decay = Math.pow(0.995, deltaTime);
            vx *= decay;
            vy *= decay;
          }
        }
        
        sticker.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      }
      
      sticker.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      
      // Use both rAF and setInterval for best coverage
      function animateRAF() {
        update();
        requestAnimationFrame(animateRAF);
      }
      
      // setInterval runs even in low power mode (though slower)
      setInterval(update, interval);
      requestAnimationFrame(animateRAF);
      
      window.addEventListener('resize', () => {
        const screenW = window.innerWidth;
        const screenH = window.innerHeight;
        baseSpeed = getBaseSpeed();
        if (x + stickerWidth > screenW) x = screenW - stickerWidth;
        if (y + stickerHeight > screenH) y = screenH - stickerHeight;
        if (x < 0) x = 0;
        if (y < 0) y = 0;
      });
    })();
  </script>
</body>
</html>
