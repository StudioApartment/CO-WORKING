<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CO—WORKING</title>
  <meta name="description" content="CO—WORKING — a fictional corporation that accidentally becomes a real one. Enterprise solutions for creative people.">
  <meta property="og:title" content="CO—WORKING">
  <meta property="og:description" content="A fictional corporation that accidentally becomes a real one. Enterprise solutions for creative people.">
  <meta property="og:image" content="images/hero-scan.png">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="images/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lib/interior-ui.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .sticker-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sticker {
      position: absolute;
      width: 440px;
      height: auto;
      will-change: transform;
      filter: drop-shadow(0 15px 35px rgba(0,0,0,0.6));
      transform-origin: center center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .sticker video {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    /* ——— Logo Overlay ——— */
    .logo-overlay {
      position: fixed;
      top: calc(2rem + 6px);
      left: 2rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 20;
      text-align: left;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .logo-we-are {
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(1.5rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 0.85rem;
    }

    .logo-main {
      width: auto;
      height: auto;
      max-width: min(90vw, 36rem);
      filter: brightness(0) invert(1);
    }

    .site-nav {
      position: fixed;
      top: 2rem;
      right: 2rem;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .site-nav a {
      font-family: "IBM Plex Mono", "SF Mono", "Cascadia Mono", monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
    }

    .site-nav a:hover {
      text-decoration: underline;
    }

    .nav-cta {
      border: 1px solid #fff;
      padding: 0.4rem 0.7rem;
      background: #fff;
      color: #000 !important;
    }

    .nav-cta:hover {
      background: transparent;
      color: #fff !important;
      text-decoration: none !important;
    }

    .page-nav {
      position: fixed;
      top: 2rem;
      right: calc(2rem + 10rem);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      height: 1.5rem;
      line-height: 1.5rem;
    }

    .page-nav-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
      padding: 0.25rem;
      opacity: 0.6;
      transition: opacity 0.2s ease;
      font-family: system-ui, sans-serif;
      line-height: 1;
    }

    .page-nav-btn:hover {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .page-nav {
        position: fixed;
        top: 1rem;
        right: calc(1rem + 4px);
        left: auto;
        z-index: 9999;
        gap: 1rem;
      }

      .page-nav-btn {
        font-size: 2.2rem;
        padding: 0.75rem;
        -webkit-tap-highlight-color: rgba(255,255,255,0.2);
        touch-action: manipulation;
      }

      .logo-overlay {
        top: 50%;
        left: 1.5rem;
        transform: translateY(calc(-50% + 13px));
      }

      .logo-we-are {
        font-size: 1.25rem;
      }

      .logo-main {
        max-width: 70vw;
      }

      .site-nav {
        position: absolute;
        top: 50%;
        left: 1.5rem;
        right: auto;
        transform: translateY(calc(-50% + 4.5rem + 13px));
        gap: 0.75rem;
        justify-content: flex-start;
      }

      .site-nav a {
        font-size: 0.62rem;
      }

      .nav-cta {
        padding: 0.35rem 0.55rem;
      }

    }

    /* ——— Scroll Spacer ——— */
    .scroll-spacer {
      height: 100vh;
      pointer-events: none;
      position: relative;
    }

    .scroll-content {
      display: none;
    }

    /* ——— Footer ——— */
    .site-footer {
      position: relative;
      z-index: 30;
      background: transparent;
      padding: 1.5rem clamp(1.25rem, 4vw, 2.5rem) 2rem;
      color: #fff;
    }

    .footer-inner {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 2rem;
      align-items: start;
      text-align: left;
    }

    .footer-brand {
      text-align: left;
      justify-self: start;
    }

    .footer-position {
      margin: 0;
      font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      color: #fff;
    }

    .footer-label {
      margin: 0 0 0.5rem;
      font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }

    .footer-team ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .footer-team li {
      margin-bottom: 0.35rem;
      font-size: 0.9rem;
      color: #fff;
    }

    .footer-meta {
      text-align: right;
      font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }

    .footer-meta p {
      margin: 0 0 0.5rem;
    }

    .footer-meta a {
      font-family: inherit;
      font-size: inherit;
      color: #fff;
      text-decoration: none;
    }

    .footer-meta a:hover {
      text-decoration: underline;
      color: #fff;
    }

    @media (max-width: 900px) {
      .footer-inner {
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }

      .footer-brand {
        grid-column: 1 / -1;
      }

      .footer-meta {
        text-align: left;
      }
    }

    @media (max-width: 600px) {
      .scroll-spacer {
        height: auto;
        min-height: 100vh;
        display: flex;
        align-items: center;
        pointer-events: auto;
      }

      .scroll-content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 1.5rem;
        padding-top: calc(1.5rem + 13px);
        gap: 0.5rem;
      }

      .scroll-content .logo-we-are {
        font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fff;
        margin: 0 0 0.85rem 0;
      }

      .scroll-content .logo-main {
        max-width: 70vw;
        height: auto;
      }

      .scroll-content .nav-cta {
        margin-top: 1rem;
        font-family: "IBM Plex Mono", "SF Mono", "Cascadia Mono", monospace;
        font-size: 0.62rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        color: #000;
        border: 1px solid #fff;
        padding: 0.35rem 0.55rem;
        background: #fff;
      }

      .logo-overlay,
      .site-nav {
        display: none;
      }

      .footer-inner {
        grid-template-columns: 1fr;
      }
    }
  </style>
<script defer src="/lib/analytics.js"></script>
</head>
<body>
  <a class="wii-back" href="/" aria-label="Back to the Office" data-tip="Back to the Office">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 6l-6 6 6 6"/>
    </svg>
  </a>

  <div class="sticker-container">
    <div class="sticker" id="sticker">
      <video id="flagVid" autoplay loop muted playsinline disablepictureinpicture>
        <source src="images/flag.webm" type="video/webm">
      </video>
    </div>
  </div>

  <!-- Logo Overlay -->
  <a href="/" class="logo-overlay">
    <p class="logo-we-are">we are</p>
    <img class="logo-main" src="images/logo-lockup.png?v=2" alt="CO—WORKING">
  </a>

  <script>
    (function() {
      const sticker = document.getElementById('sticker');
      const video = document.getElementById('flagVid');
      
      // Ensure video plays
      video.play().catch(() => {});
      
      // Wait for video to load to get dimensions
      let stickerWidth, stickerHeight;
      
      function initDimensions() {
        const rect = sticker.getBoundingClientRect();
        stickerWidth = rect.width;
        stickerHeight = rect.height;
      }
      
      // Offset to compensate for transparent padding in the video file
      // Different sides may have different amounts of transparent space
      const PADDING_LEFT = 100;
      const PADDING_RIGHT = 120;
      const PADDING_TOP = 50;
      const PADDING_BOTTOM = 50;
      
      // Get bounds (push past edge to compensate for video's transparent padding)
      function getBounds() {
        return {
          minX: -PADDING_LEFT,
          maxX: window.innerWidth - stickerWidth + PADDING_RIGHT,
          minY: -PADDING_TOP,
          maxY: window.innerHeight - stickerHeight + PADDING_BOTTOM
        };
      }
      
      // Initialize position within safe zone
      function initPosition() {
        initDimensions();
        const bounds = getBounds();
        x = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
        y = bounds.minY + Math.random() * (bounds.maxY - bounds.minY);
      }
      
      let x = 100, y = 100;
      
      // Speed as percentage of screen per second
      const speedPercent = 20;
      
      function getBaseSpeed() {
        return (Math.min(window.innerWidth, window.innerHeight) * speedPercent) / 100 / 60;
      }
      
      let baseSpeed = getBaseSpeed();
      let vx = baseSpeed * (Math.random() > 0.5 ? 1 : -1);
      let vy = baseSpeed * (Math.random() > 0.5 ? 1 : -1);
      
      // Spin physics
      let currentRotation = 0;
      let spinVelocity = 0; // degrees per frame
      const spinFriction = 0.997; // How quickly spin slows down (higher = slower decay)
      const spinImpulse = 1.5; // Initial spin speed on wall hit (degrees per frame)
      
      const cornerThreshold = 80;
      
      function isNearCorner(x, y, bounds) {
        const nearLeft = x < bounds.minX + cornerThreshold;
        const nearRight = x > bounds.maxX - cornerThreshold;
        const nearTop = y < bounds.minY + cornerThreshold;
        const nearBottom = y > bounds.maxY - cornerThreshold;
        return (nearLeft || nearRight) && (nearTop || nearBottom);
      }
      
      function nudgeAwayFromCorner(bounds) {
        const nudge = baseSpeed * 0.25;
        
        const nearLeft = x < bounds.minX + cornerThreshold;
        const nearRight = x > bounds.maxX - cornerThreshold;
        const nearTop = y < bounds.minY + cornerThreshold;
        const nearBottom = y > bounds.maxY - cornerThreshold;
        
        if (nearLeft && nearTop) {
          vx = Math.abs(vx) + nudge;
          vy = Math.abs(vy) + nudge;
        } else if (nearRight && nearTop) {
          vx = -Math.abs(vx) - nudge;
          vy = Math.abs(vy) + nudge;
        } else if (nearLeft && nearBottom) {
          vx = Math.abs(vx) + nudge;
          vy = -Math.abs(vy) - nudge;
        } else if (nearRight && nearBottom) {
          vx = -Math.abs(vx) - nudge;
          vy = -Math.abs(vy) - nudge;
        }
        
        // Clamp speed
        const maxSpeed = baseSpeed * 1.6;
        vx = Math.max(-maxSpeed, Math.min(maxSpeed, vx));
        vy = Math.max(-maxSpeed, Math.min(maxSpeed, vy));
      }
      
      let lastTime = performance.now();
      const targetFPS = 60;
      const interval = 1000 / targetFPS;
      
      function update() {
        const now = performance.now();
        const deltaTime = Math.min((now - lastTime) / interval, 3);
        lastTime = now;
        
        const bounds = getBounds();
        
        // Update position
        x += vx * deltaTime;
        y += vy * deltaTime;
        
        // Bounce off boundaries with spin
        let hitWall = false;
        
        if (x <= bounds.minX) {
          x = bounds.minX;
          vx = Math.abs(vx);
          vy += (Math.random() - 0.5) * baseSpeed * 0.3;
          hitWall = true;
          spinVelocity = (Math.random() > 0.5 ? 1 : -1) * spinImpulse * (0.8 + Math.random() * 0.4);
        } else if (x >= bounds.maxX) {
          x = bounds.maxX;
          vx = -Math.abs(vx);
          vy += (Math.random() - 0.5) * baseSpeed * 0.3;
          hitWall = true;
          spinVelocity = (Math.random() > 0.5 ? 1 : -1) * spinImpulse * (0.8 + Math.random() * 0.4);
        }
        
        if (y <= bounds.minY) {
          y = bounds.minY;
          vy = Math.abs(vy);
          vx += (Math.random() - 0.5) * baseSpeed * 0.3;
          hitWall = true;
          spinVelocity = (Math.random() > 0.5 ? 1 : -1) * spinImpulse * (0.8 + Math.random() * 0.4);
        } else if (y >= bounds.maxY) {
          y = bounds.maxY;
          vy = -Math.abs(vy);
          vx += (Math.random() - 0.5) * baseSpeed * 0.3;
          hitWall = true;
          spinVelocity = (Math.random() > 0.5 ? 1 : -1) * spinImpulse * (0.8 + Math.random() * 0.4);
        }
        
        // Corner avoidance
        if (isNearCorner(x, y, bounds)) {
          nudgeAwayFromCorner(bounds);
        } else {
          // Gradual speed normalization
          const speedMag = Math.sqrt(vx * vx + vy * vy);
          if (speedMag > baseSpeed * 1.1) {
            const decay = Math.pow(0.992, deltaTime);
            vx *= decay;
            vy *= decay;
          }
        }
        
        // Apply spin with friction (slows down over time)
        currentRotation += spinVelocity * deltaTime;
        spinVelocity *= Math.pow(spinFriction, deltaTime);
        
        // Stop spinning when very slow
        if (Math.abs(spinVelocity) < 0.01) {
          spinVelocity = 0;
        }
        
        // Apply transform with rotation
        sticker.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${currentRotation}deg)`;
      }
      
      // Initialize after video loads
      if (video.readyState >= 1) {
        initPosition();
        sticker.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      } else {
        video.addEventListener('loadedmetadata', () => {
          initPosition();
          sticker.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        });
      }
      
      // Fallback init
      setTimeout(() => {
        if (!stickerWidth) {
          initPosition();
          sticker.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        }
      }, 100);
      
      // Animation loop with both rAF and setInterval for low power mode
      function animateRAF() {
        update();
        requestAnimationFrame(animateRAF);
      }
      
      setInterval(update, interval);
      requestAnimationFrame(animateRAF);
      
      // Handle resize - clamp position to safe zone
      window.addEventListener('resize', () => {
        initDimensions();
        baseSpeed = getBaseSpeed();
        const bounds = getBounds();
        
        // Clamp position to safe zone
        x = Math.max(bounds.minX, Math.min(bounds.maxX, x));
        y = Math.max(bounds.minY, Math.min(bounds.maxY, y));
      });
    })();
  </script>
<script src="/lib/interior-ui.js"></script>
</body>
</html>
