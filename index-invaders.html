      right: 2rem;
      z-index: 60;
      display: flex;
      align-items: center;

      font-family: "IBM Plex Mono", "SF Mono", "Cascadia Mono", monospace;

      font-weight: 500;

      text-decoration: none;
      color: #fff;

    .site-nav a:hover {

    .nav-cta {
      border: 1px solid rgba(255,255,255,0.5);

<script>
(function () {

  // ═══════════════════════════════════════════════
  //  CANVAS — responsive, fills viewport
  // ═══════════════════════════════════════════════

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, scale, offsetX, offsetY;

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = vw * dpr;
    canvas.height = vh * dpr;
    W = vw; H = vh;
    const sx = vw / GAME_W, sy = vh / GAME_H;
    scale = Math.min(sx, sy);
    offsetX = (vw - GAME_W * scale) / 2;
    offsetY = (vh - GAME_H * scale) / 2;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  function applyGameTransform() {
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);
  }

  // ═══════════════════════════════════════════════
  //  PIXEL TEXT RENDERER
  // ═══════════════════════════════════════════════

  const _tc = document.createElement('canvas');
  _tc.width = 512; _tc.height = 32;
  const _tx = _tc.getContext('2d');

  function pixText(str, x, y, sz, col, align) {
    const base = 14;
    const sc = sz / base;
    _tx.clearRect(0, 0, 512, 24);
    _tx.font = 'bold ' + base + 'px monospace';
    _tx.fillStyle = col;
    _tx.textAlign = 'left';
    _tx.textBaseline = 'top';
    _tx.fillText(str, 1, 1);
    const tw = Math.ceil(_tx.measureText(str).width) + 2;
    const th = base + 4;
    const dw = tw * sc, dh = th * sc;
    const prev = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    let dx = x;
    if (align === 'center') dx = x - dw / 2;
    else if (align === 'right') dx = x - dw;
    ctx.drawImage(_tc, 0, 0, tw, th, dx, y, dw, dh);
    ctx.imageSmoothingEnabled = prev;
  }

  // ═══════════════════════════════════════════════
  //  PIXEL ART HELPERS
  // ═══════════════════════════════════════════════

  function makeIcon(drawFn) {
    const c = document.createElement('canvas');
    c.width = ICON_PX; c.height = ICON_PX;
    const x = c.getContext('2d');
    drawFn(x);
    return c;
  }

  function cutCorners(ctx, r) {
    for (let y = 0; y < r; y++) {
      const cut = r - y;
      ctx.clearRect(0, y, cut, 1);
      ctx.clearRect(ICON_PX - cut, y, cut, 1);
      ctx.clearRect(0, ICON_PX - 1 - y, cut, 1);
      ctx.clearRect(ICON_PX - cut, ICON_PX - 1 - y, cut, 1);
    }
  }

  function makeSprite(grid, palette) {
    const h = grid.length, w = grid[0].length;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    for (let y = 0; y < h; y++)
      for (let i = 0; i < grid[y].length; i++) {
        const ch = grid[y][i];
        if (ch !== '.' && palette[ch]) { x.fillStyle = palette[ch]; x.fillRect(i, y, 1, 1); }
      }
    return c;
  }

  let audioCtx;
  function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function playTone(freq, dur, type, vol, slide) {
    try {
      ensureAudio();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  const SFX = {
    shoot:     () => playTone(880, 0.08, 'square', 0.06),
    hit:       () => playTone(220, 0.15, 'square', 0.08, 80),

  function fetchLeaderboard() {
    if (!FIREBASE_URL) return;
    fetch(FIREBASE_URL + '/leaderboard.json')
      .then(r => r.json())
      .then(data => {
        if (!data) { leaderboard = []; return; }
        leaderboard = Object.values(data)
          .sort((a, b) => b.score - a.score)
          .slice(0, LEADERBOARD_SIZE);
        const top = leaderboard[0];
        if (top && top.score > hiScore) { hiScore = top.score; localStorage.setItem('inbox_invaders_hi', hiScore); }
      })
      .catch(() => {});
  }

  function submitScore(name, sc, w) {
    if (!FIREBASE_URL) return;
    fetch(FIREBASE_URL + '/leaderboard.json', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, score: sc, wave: w, ts: Date.now() }),
    }).then(() => fetchLeaderboard()).catch(() => {});
  }

  fetchLeaderboard();

  function resetGame() {
    score = 0; lives = 3; wave = 0;
    player = { x: GAME_W / 2, y: PLAYER_Y };
    bullets = []; eBullets = []; particles = []; floatTexts = [];
    bonus = null; shakeAmount = 0; shakeDur = 0;
    shootCd = 0; invulnTimer = 0;
    bonusTimer = 300 + Math.random() * 400 | 0;
    nextWave();
  }

  function nextWave() {
    wave++;
    enemies = [];
    const gridW = COLS * (EW + EPADX) - EPADX;
    const waveOff = Math.min(wave - 1, 4) * 10;
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        enemies.push({
          row: r, col: c,
          x: (GAME_W - gridW) / 2 + c * (EW + EPADX) + EW / 2,
          y: GRID_TOP + r * (EH + EPADY) + waveOff,
          alive: true, hit: 0,
        });
      }
    enemyDir = 1;
    enemyBaseSpeed = 1.8 + (wave - 1) * 0.2;
    enemyTotalAlive = ROWS * COLS;
    eBullets = []; bonus = null;
    bonusTimer = 300 + Math.random() * 400 | 0;
    initShields();
  }

  function initShields() {
    shields = [];
    const sw = 48, sh = 34, sp = GAME_W / (SHIELD_COUNT + 1);
    for (let i = 0; i < SHIELD_COUNT; i++) {
      const pixels = [];
      for (let py = 0; py < sh; py++) {
        pixels[py] = [];
        for (let px = 0; px < sw; px++) {
          const wallThick = 2;
          const isLeftWall  = px < wallThick;
          const isRightWall = px >= sw - wallThick;
          const isBack      = py < wallThick;
          const isDeskTop   = py >= sh - 8 && py < sh - 6 && px >= 4 && px < sw - 4;
          const isDeskFront = py >= sh - 6 && px >= 4 && px < sw - 4;
          const isShelf     = py >= 4 && py < 6 && px >= 3 && px < sw - 3;
          const isMonitor   = py >= 8 && py < 16 && px >= Math.floor(sw/2) - 5 && px < Math.floor(sw/2) + 5;
          const isMonStand  = py >= 16 && py < 18 && px >= Math.floor(sw/2) - 1 && px < Math.floor(sw/2) + 1;
          if (isLeftWall || isRightWall || isBack) pixels[py][px] = 1;
          else if (isMonitor) pixels[py][px] = 3;
          else if (isMonStand) pixels[py][px] = 3;
          else if (isShelf) pixels[py][px] = 4;
          else if (isDeskTop) pixels[py][px] = 2;
          else if (isDeskFront) pixels[py][px] = 2;
          else pixels[py][px] = 0;
        }
      }
      shields.push({ x: sp * (i + 1) - sw / 2, y: GAME_H - 120, w: sw, h: sh, pixels });
    }
  }

  // ═══════════════════════════════════════════════
  //  INPUT
  // ═══════════════════════════════════════════════

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
    if (state === 'MENU' && (e.code === 'Enter' || e.code === 'Space')) { state = 'PLAYING'; resetGame(); ensureAudio(); }
    if (state === 'GAME_OVER' && (e.code === 'Enter' || e.code === 'Space')) { state = 'PLAYING'; resetGame(); }
    if (state === 'ENTER_INITIALS') {
      const cc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      if (e.code === 'ArrowUp') {
        const idx = cc.indexOf(initials[initialPos]);
        initials[initialPos] = cc[(idx + 1) % cc.length];
      } else if (e.code === 'ArrowDown') {
        const idx = cc.indexOf(initials[initialPos]);
        initials[initialPos] = cc[(idx - 1 + cc.length) % cc.length];
      } else if (e.code === 'ArrowRight' || e.code === 'Tab') {
        e.preventDefault();
        initialPos = Math.min(2, initialPos + 1);
      } else if (e.code === 'ArrowLeft') {
        initialPos = Math.max(0, initialPos - 1);
      } else if (e.code === 'Enter') {
        submitScore(initials.join(''), score, wave);
        state = 'GAME_OVER';
      } else if (e.key.length === 1 && /[A-Za-z0-9]/.test(e.key)) {
        initials[initialPos] = e.key.toUpperCase();
        if (initialPos < 2) initialPos++;
      }
    }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  const touchState = { left: false, right: false, fire: false };
  function bindBtn(id, key) {
    const el = document.getElementById(id);
    const on = () => { touchState[key] = true; el.classList.add('active'); ensureAudio(); };
    const off = () => { touchState[key] = false; el.classList.remove('active'); };
    el.addEventListener('touchstart', e => { e.preventDefault(); on(); });
    el.addEventListener('touchend', e => { e.preventDefault(); off(); });
    el.addEventListener('touchcancel', off);
    el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
  }
  bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right'); bindBtn('btn-fire', 'fire');

  canvas.addEventListener('click', () => {
    if (state === 'MENU') { state = 'PLAYING'; resetGame(); ensureAudio(); }
    else if (state === 'GAME_OVER') { state = 'PLAYING'; resetGame(); }
  });

  function isLeft()  { return keys.ArrowLeft || keys.KeyA || touchState.left; }
  function isRight() { return keys.ArrowRight || keys.KeyD || touchState.right; }
  function isFire()  { return keys.Space || keys.ArrowUp || keys.KeyW || touchState.fire; }

  // ═══════════════════════════════════════════════
  //  UPDATE
  // ═══════════════════════════════════════════════

  function update() {
    if (state !== 'PLAYING') return;

    if (isLeft())  player.x = Math.max(PLAYER_W / 2 + 4, player.x - PLAYER_SPEED);
    if (isRight()) player.x = Math.min(GAME_W - PLAYER_W / 2 - 4, player.x + PLAYER_SPEED);

    if (shootCd > 0) shootCd--;
    if (isFire() && shootCd <= 0 && bullets.length < MAX_BULLETS) {
      bullets.push({ x: player.x, y: player.y - PLAYER_H / 2 - 4 });
      shootCd = SHOOT_CD; SFX.shoot();
    }

    bullets  = bullets.filter(b  => { b.y -= BULLET_SPEED; return b.y > -10; });
    eBullets = eBullets.filter(b => { b.y += ENEMY_BULLET_SPEED + (wave - 1) * 0.18; return b.y < GAME_H + 10; });

    if (invulnTimer > 0) invulnTimer--;

    const alive = enemies.filter(e => e.alive);
    enemyTotalAlive = alive.length;
    if (enemyTotalAlive === 0) { SFX.waveWin(); nextWave(); return; }

    const spMul = Math.max(1, (ROWS * COLS) / Math.max(enemyTotalAlive, 1));
    const curSp = Math.min(enemyBaseSpeed * Math.sqrt(spMul), 4);

    let minX = GAME_W, maxX = 0;
    alive.forEach(e => { minX = Math.min(minX, e.x - EW / 2); maxX = Math.max(maxX, e.x + EW / 2); });

    if ((enemyDir > 0 && maxX + curSp >= GAME_W - 8) || (enemyDir < 0 && minX - curSp <= 8)) {
      enemyDir *= -1;
      enemies.forEach(e => { if (e.alive) e.y += 12 + wave * 0.4; });
    } else {
      enemies.forEach(e => { if (e.alive) e.x += curSp * enemyDir; });
    }

    enemies.forEach(e => { if (e.hit > 0) e.hit--; });

    const fc = 0.004 + wave * 0.0012;
    const bots = [];
    for (let c = 0; c < COLS; c++)
      for (let r = ROWS - 1; r >= 0; r--) { const e = enemies[r * COLS + c]; if (e && e.alive) { bots.push(e); break; } }
    bots.forEach(e => { if (Math.random() < fc && eBullets.length < 5 + wave) eBullets.push({ x: e.x, y: e.y + EH / 2 }); });

    if (!bonus) {
      bonusTimer--;
      if (bonusTimer <= 0) {
        const fl = Math.random() > 0.5;
        bonus = { x: fl ? -30 : GAME_W + 30, y: 36, dir: fl ? 1 : -1, speed: 2 + wave * 0.2,
          pts: [150, 200, 250, 300][Math.random() * 4 | 0] };
      }
    } else {
      bonus.x += bonus.speed * bonus.dir;
      if (frame % 30 === 0) SFX.bonus();
      if (bonus.x < -40 || bonus.x > GAME_W + 40) { bonus = null; bonusTimer = 400 + Math.random() * 600 | 0; }
    }

    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi]; let hit = false;
      for (const e of enemies) {
        if (!e.alive) continue;
        if (Math.abs(b.x - e.x) < EW / 2 + 3 && Math.abs(b.y - e.y) < EH / 2 + 3) {
          e.alive = false; e.hit = 10;
          const t = TYPES[e.row]; score += t.pts;
          spawnExplosion(e.x, e.y, t.glow, 14);
          floatTexts.push({ x: e.x, y: e.y, text: '+' + t.pts, life: 40, color: t.glow });
          SFX.hit(); hit = true; break;
        }
      }
      if (!hit && bonus && Math.abs(b.x - bonus.x) < 20 && Math.abs(b.y - bonus.y) < 14) {
        score += bonus.pts;
        spawnExplosion(bonus.x, bonus.y, BONUS_TYPE.glow, 20);
        floatTexts.push({ x: bonus.x, y: bonus.y, text: '+' + bonus.pts, life: 50, color: BONUS_TYPE.glow });
        SFX.bonusHit(); bonus = null; bonusTimer = 500 + Math.random() * 600 | 0; hit = true;
      }
      if (hit) { bullets.splice(bi, 1); continue; }
      for (const s of shields) { if (hitShield(s, b.x, b.y, 3)) { bullets.splice(bi, 1); break; } }
    }

    if (invulnTimer <= 0) {
      for (let bi = eBullets.length - 1; bi >= 0; bi--) {
        const b = eBullets[bi];
        if (Math.abs(b.x - player.x) < PLAYER_W / 2 + 2 && Math.abs(b.y - player.y) < PLAYER_H / 2 + 2) {
          eBullets.splice(bi, 1); playerGotHit(); break;
        }
      }
    }

    for (let bi = eBullets.length - 1; bi >= 0; bi--)
      for (const s of shields) { if (hitShield(s, eBullets[bi].x, eBullets[bi].y, 3)) { eBullets.splice(bi, 1); break; } }

    for (const e of alive)
      for (const s of shields)
        if (e.x + EW / 2 > s.x && e.x - EW / 2 < s.x + s.w && e.y + EH / 2 > s.y && e.y - EH / 2 < s.y + s.h)
          for (let py = 0; py < s.h; py++) for (let px = 0; px < s.w; px++) s.pixels[py][px] = 0;

    if (Math.max(...alive.map(e => e.y + EH / 2)) >= PLAYER_Y - 10) { lives = 0; gameOverSeq(); }

    particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--; return p.life > 0; });
    floatTexts = floatTexts.filter(f => { f.y -= 1.2; f.life--; return f.life > 0; });
    if (shakeDur > 0) shakeDur--; else shakeAmount = 0;
  }

  function hitShield(s, bx, by, r) {
    const lx = Math.round(bx - s.x), ly = Math.round(by - s.y);
    if (lx < -r || lx >= s.w + r || ly < -r || ly >= s.h + r) return false;
    let hit = false;
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const px = lx + dx, py = ly + dy;
      if (px >= 0 && px < s.w && py >= 0 && py < s.h && s.pixels[py][px]) { s.pixels[py][px] = 0; hit = true; }
    }
    return hit;
  }

  function playerGotHit() {
    lives--;
    spawnExplosion(player.x, player.y, COL.alert, 16);
    shakeAmount = 6; shakeDur = 12;
    SFX.playerHit(); invulnTimer = 90;
    if (lives <= 0) gameOverSeq();
  }

  function gameOverSeq() {
    shakeDur = 0; shakeAmount = 0;
    if (score > hiScore) { hiScore = score; localStorage.setItem('inbox_invaders_hi', hiScore); }
    SFX.gameOver();
    if (FIREBASE_URL) {
      state = 'ENTER_INITIALS';
      initials = ['A', 'A', 'A'];
      initialPos = 0;
    } else {
      state = 'GAME_OVER';
    }
  }

  function spawnExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 3 + 1;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        life: 20 + Math.random() * 15 | 0, color, size: Math.random() * 3 + 1.5 });
    }
  }

  // ═══════════════════════════════════════════════
  //  RENDER
  // ═══════════════════════════════════════════════

  function render() {
    ctx.save();
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, W, H);

    applyGameTransform();

    if (shakeDur > 0) ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);

    stars.forEach(s => {
      ctx.globalAlpha = s.a * (Math.sin(frame * s.speed + s.phase) * 0.3 + 0.7);
      ctx.fillStyle = '#c8d6e5';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    if (state === 'MENU') { renderMenu(); ctx.restore(); return; }
    if (state === 'ENTER_INITIALS') { renderInitials(); ctx.restore(); return; }

    ctx.imageSmoothingEnabled = false;

    shields.forEach(renderShield);
    enemies.forEach(e => { if (e.alive) renderEnemy(e); });
    if (bonus) renderBonus();

    bullets.forEach(b => {
      ctx.drawImage(envelopeSprite, b.x - 8, b.y - 6, 16, 12);
      ctx.globalAlpha = 0.25; ctx.fillStyle = COL.manila;
      ctx.fillRect(b.x - 1, b.y + 4, 2, 8); ctx.globalAlpha = 1;
    });

    eBullets.forEach(b => {
      ctx.fillStyle = COL.alert; ctx.shadowColor = COL.alert; ctx.shadowBlur = 6;
      ctx.fillRect(b.x - 2, b.y - 5, 4, 10); ctx.shadowBlur = 0;
    });

    if (state === 'PLAYING' && (invulnTimer <= 0 || frame % 4 < 2))
      ctx.drawImage(playerSprite, player.x - 16, player.y - 16, 32, 32);

    ctx.imageSmoothingEnabled = true;

    particles.forEach(p => {
      ctx.globalAlpha = p.life / 35; ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    floatTexts.forEach(f => {
      ctx.globalAlpha = Math.min(1, f.life / 15);
      ctx.font = '8px "Press Start 2P", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    });
    ctx.globalAlpha = 1;

    renderHUD();
    if (state === 'GAME_OVER') renderGameOver();
    ctx.restore();
  }

  function renderEnemy(e) {
    const t = TYPES[e.row];
    const wobble = Math.sin(frame * 0.06 + e.col * 0.5) * 1.5;
    ctx.save();
    ctx.shadowColor = t.glow; ctx.shadowBlur = 10;
    ctx.drawImage(t.icon, e.x - EW / 2, e.y - EH / 2 + wobble, EW, EH);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function renderBonus() {
    ctx.save();
    ctx.shadowColor = BONUS_TYPE.glow;
    ctx.shadowBlur = 14 + Math.sin(frame * 0.15) * 3;
    ctx.drawImage(BONUS_TYPE.icon, bonus.x - 18, bonus.y - 18, 36, 36);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  const CUBICLE_COLORS = { 1: '#8A8A7A', 2: '#B0A890', 3: '#4A6A8A', 4: '#9A9A88' };
  function renderShield(s) {
    ctx.globalAlpha = 0.85;
    for (let py = 0; py < s.h; py++)
      for (let px = 0; px < s.w; px++) {
        const v = s.pixels[py][px];
        if (v) { ctx.fillStyle = CUBICLE_COLORS[v] || '#8A8A7A'; ctx.fillRect(s.x + px, s.y + py, 1, 1); }
      }
    ctx.globalAlpha = 1;
  }

  function renderHUD() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, GAME_W, 28);
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textBaseline = 'middle';

    ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
    ctx.fillText('SCORE ' + String(score).padStart(6, '0'), 8, 15);

    ctx.textAlign = 'center'; ctx.fillStyle = '#888';
    ctx.fillText('HI ' + String(hiScore).padStart(6, '0'), GAME_W / 2, 15);

    ctx.textAlign = 'right'; ctx.fillStyle = '#33ff88';
    ctx.fillText('WAVE ' + wave, GAME_W - 50, 15);

    ctx.imageSmoothingEnabled = false;
    for (let i = 0; i < lives; i++)
      ctx.drawImage(playerSprite, GAME_W - 16 - i * 16, 5, 14, 14);
    ctx.imageSmoothingEnabled = true;
  }

  // ═══════════════════════════════════════════════
  //  SPACE INVADERS-STYLE LOGO
  // ═══════════════════════════════════════════════

  function drawLogo(cx, cy) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const lines = [
      { t: 'INBOX', sz: 64, y: cy },
      { t: 'INVADERS', sz: 58, y: cy + 62 },
    ];

    lines.forEach(l => {
      ctx.font = 'bold italic ' + l.sz + 'px Impact, "Arial Black", sans-serif';
      ctx.letterSpacing = '3px';

      for (let i = 8; i >= 1; i--) {
        ctx.fillStyle = i > 4 ? '#5A0A0A' : '#B22010';
        ctx.fillText(l.t, cx + 1, l.y + i);
      }

      ctx.fillStyle = '#D42A1A';
      ctx.fillText(l.t, cx, l.y + 1);

      ctx.fillStyle = '#FFD700';
      ctx.fillText(l.t, cx, l.y);

      ctx.fillStyle = 'rgba(255, 255, 200, 0.25)';
      ctx.fillText(l.t, cx, l.y - 1);
    });

    ctx.letterSpacing = '0px';
    ctx.restore();
  }

  // ═══════════════════════════════════════════════
  //  MENU
  // ═══════════════════════════════════════════════

  function renderMenu() {
    drawLogo(GAME_W / 2, GAME_H * 0.18);

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    
    if (leaderboard.length > 0) {
      const lbTop = GAME_H * 0.42;
      ctx.font = '10px "Press Start 2P", monospace'; ctx.fillStyle = '#FFD700';
      ctx.fillText('HIGH SCORES', GAME_W / 2, lbTop);
      ctx.font = '8px "Press Start 2P", monospace';
      leaderboard.slice(0, 8).forEach((entry, i) => {
        const y = lbTop + 24 + i * 20;
        const rank = String(i + 1) + '.';
        const sc = String(entry.score).padStart(6, '0');
        ctx.fillStyle = i === 0 ? '#FFD700' : i < 3 ? '#ccc' : '#888';
        ctx.fillText(rank + ' ' + (entry.name || '???') + ' ' + sc, GAME_W / 2, y);
      });
    } else {
      ctx.font = '8px "Press Start 2P", monospace';
      ctx.fillStyle = '#888';
      ctx.fillText('DEFEND YOUR SANITY', GAME_W / 2, GAME_H * 0.42);
      if (hiScore > 0) {
        ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#888';
        ctx.fillText('BEST ' + hiScore, GAME_W / 2, GAME_H * 0.50);
      }
    }

    const pulse = Math.sin(frame * 0.06) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#FFD700';
    ctx.fillText('PRESS START', GAME_W / 2, GAME_H * 0.86);
    ctx.globalAlpha = 1;

    ctx.font = '6px "Press Start 2P", monospace'; ctx.fillStyle = '#555';
    ctx.fillText('ARROWS MOVE   SPACE FIRE', GAME_W / 2, GAME_H * 0.92);
  }

  function renderInitials() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    ctx.font = '14px "Press Start 2P", monospace'; ctx.fillStyle = '#FFD700';
    ctx.fillText('NEW HIGH SCORE', GAME_W / 2, GAME_H * 0.16);

    ctx.font = '12px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
    ctx.fillText('SCORE ' + score, GAME_W / 2, GAME_H * 0.26);

    ctx.font = '10px "Press Start 2P", monospace'; ctx.fillStyle = '#33ff88';
    ctx.fillText('WAVE ' + wave, GAME_W / 2, GAME_H * 0.33);

    ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#888';
    ctx.fillText('ENTER INITIALS', GAME_W / 2, GAME_H * 0.42);

    const boxW = 50, boxH = 60, gap = 14;
    const totalW = boxW * 3 + gap * 2;
    const startX = (GAME_W - totalW) / 2;
    const boxY = GAME_H * 0.48;

    for (let i = 0; i < 3; i++) {
      const bx = startX + i * (boxW + gap);
      ctx.strokeStyle = i === initialPos ? '#FFD700' : '#555';
      ctx.lineWidth = i === initialPos ? 3 : 2;
      ctx.strokeRect(bx, boxY, boxW, boxH);

      ctx.font = '24px "Press Start 2P", monospace';
      ctx.fillStyle = i === initialPos ? '#FFD700' : '#fff';
      ctx.fillText(initials[i], bx + boxW / 2, boxY + boxH / 2 + 4);

      if (i === initialPos) {
        const arrowPulse = Math.sin(frame * 0.1) * 3;
        ctx.font = '12px "Press Start 2P", monospace'; ctx.fillStyle = '#FFD700';
        ctx.fillText('^', bx + boxW / 2, boxY - 10 + arrowPulse);
        ctx.fillText('v', bx + boxW / 2, boxY + boxH + 14 - arrowPulse);
      }
    }

    const pulse = Math.sin(frame * 0.06) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#00e5ff';
    ctx.fillText('PRESS ENTER', GAME_W / 2, GAME_H * 0.80);
    ctx.globalAlpha = 1;

    ctx.font = '6px "Press Start 2P", monospace'; ctx.fillStyle = '#555';
    ctx.fillText('TYPE YOUR INITIALS', GAME_W / 2, GAME_H * 0.88);
  }

  function renderGameOver() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    ctx.font = '20px "Press Start 2P", monospace'; ctx.fillStyle = '#ff3344';
    ctx.fillText('GAME OVER', GAME_W / 2, GAME_H * 0.38);

    ctx.font = '10px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
    ctx.fillText('SCORE ' + score, GAME_W / 2, GAME_H * 0.48);

    if (score >= hiScore && score > 0) {
      ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#FFD700';
      ctx.fillText('NEW HIGH SCORE', GAME_W / 2, GAME_H * 0.54);
    } else {
      ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#888';
      ctx.fillText('BEST ' + hiScore, GAME_W / 2, GAME_H * 0.54);
    }

    ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#fff';
    ctx.fillText('WAVE ' + wave, GAME_W / 2, GAME_H * 0.60);

    const pulse = Math.sin(frame * 0.06) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#00e5ff';
    ctx.fillText('PRESS START', GAME_W / 2, GAME_H * 0.70);
    ctx.globalAlpha = 1;
  }

  // ═══════════════════════════════════════════════
  //  MAIN LOOP
  // ═══════════════════════════════════════════════

  function tick() {
    update();
    render();
    frame++;
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
